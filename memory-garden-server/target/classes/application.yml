server:
  port: 8080

spring:
  application:
    name: memory-garden
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# JWT 密钥配置（生产环境必须通过环境变量 JWT_SECRET 注入强随机密钥）
jwt:
  secret: ${JWT_SECRET:}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.memorygarden.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true
